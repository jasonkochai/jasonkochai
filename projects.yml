# Single source of truth for the Projects and 42 Berlin sections of README.md.
# Edit this file, push, and the readme workflow rewrites the README.
#
# name       project name as shown
# group      own (your own work, the main Projects section) or 42 (42 Berlin)
# status     shipped, building or paused; only shipped own work lands under "Shipped"
# one_liner  what it does plus the interesting technical bit; no dashes, no middle dots
# links      label: url, in the order they should appear (a shipped project needs one)
# image      optional drawing or screenshot: light, dark and alt

projects:
  - name: Juniper
    group: own
    status: building
    one_liner: >-
      Multi-agent personal assistant on OpenClaw, self-hosted in Docker on my
      home server. One Telegram forum topic per agent: news, events, email,
      calendar, notes. Each agent gets only the tools and the model its job needs.
    links:
      Code: https://github.com/jasonkochai/juniper

  - name: Fly-in
    group: "42"
    status: shipped
    one_liner: >-
      Routes a drone fleet through a capacity-limited graph in the fewest
      turns with a time-expanded search. Hits the known optimum on every map.
      Python.
    links:
      Watch it solve: https://fly-in-showcase.vercel.app
      Code: https://github.com/jasonkochai/42-Fly-in

  - name: A-maze-ing
    group: "42"
    status: shipped
    one_liner: >-
      Maze generator with a terminal visualiser. Team project: I built the
      application layer on a pip-installable engine by
      [@PhilipHim](https://github.com/PhilipHim). Python.
    links:
      Code: https://github.com/jasonkochai/42-A-maze-ing

  - name: push_swap
    group: "42"
    status: shipped
    one_liner: >-
      Sorts a stack with 11 allowed operations, choosing its strategy by the
      measured disorder of the input. C, team lead.
    links:
      Code: https://github.com/jasonkochai/42-push_swap

  - name: Born2beRoot
    group: "42"
    status: shipped
    one_liner: >-
      Hardened Debian 13 server: encrypted LVM, UFW, Fail2ban, a WordPress
      stack and a Bash monitoring script.
    links:
      Code: https://github.com/jasonkochai/42-Born2beRoot
