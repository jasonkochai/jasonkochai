<style>/* Hallmark · shape: profile README, drawing set · genre: modern-minimal · theme: Blueprint (deal 1/3) · blueprint: whiteprint · job: hire
 * signature: the title block over the 42 Berlin dimension string · imagery: drawings of real data, no photographs
 * axes: mid/geometric-sans/neutral · posture: drenched · contrast: pass · v2.0.0 */
/* Hallmark · pre-emit critique: P4 H4 E4 S5 R4 V5 · weakest: P, the drawing look could turn into costume; every line, end and label carries a real fact */
:root { --paper: #f3f7fa; --paper-2: #e7eef3; --paper-3: #dce6ee; --ink: #0d3970; --ink-2: #1f4a80; --muted: #4d6b91; --rule: rgba(13, 57, 112, 0.85); --rule-2: rgba(13, 57, 112, 0.32); --grid: rgba(13, 57, 112, 0.07); --grid-2: rgba(13, 57, 112, 0.16); }
.paper { fill: var(--paper); }
.paper-2 { fill: var(--paper-2); }
.ink { fill: var(--ink); }
.muted { fill: var(--muted); }
.line { fill: none; stroke: var(--rule); stroke-width: 1; }
.line-2 { fill: none; stroke: var(--rule-2); stroke-width: 1; }
.heavy { fill: none; stroke: var(--ink); stroke-width: 2; }
.grid { fill: none; stroke: var(--grid); stroke-width: 1; }
.grid-2 { fill: none; stroke: var(--grid-2); stroke-width: 1; }
.draw { stroke-dasharray: 1; stroke-dashoffset: 0; }
.from-left { transform-box: fill-box; transform-origin: left; }
.from-bottom { transform-box: fill-box; transform-origin: bottom; }
@keyframes draw { from { stroke-dashoffset: 1; } }
@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }
@keyframes grow-x { from { transform: scaleX(0); } }
@keyframes grow-y { from { transform: scaleY(0); } }
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; }
}

.draw { animation: draw 1.4s cubic-bezier(0.22, 1, 0.36, 1) both; }
.draw + .draw { animation-delay: 0.15s; }
.cover { transform: scaleX(0); transform-box: fill-box; transform-origin: right;
  animation: uncover 0.9s linear 0.35s both; }
.pen { opacity: 0; animation: pen 0.9s linear 0.35s both; }
.dim { animation: grow-x 0.9s cubic-bezier(0.22, 1, 0.36, 1) 1.1s both; }
.done { animation: grow-x 0.7s cubic-bezier(0.22, 1, 0.36, 1) 1.6s both; }
.label { animation: fade 0.6s cubic-bezier(0.22, 1, 0.36, 1) 1.5s both; }
.marker { animation: rise 0.5s cubic-bezier(0.22, 1, 0.36, 1) 2.1s both; }
@keyframes uncover { from { transform: scaleX(1); } to { transform: scaleX(0); } }
@keyframes pen {
  from { opacity: 1; transform: translateX(0); }
  95% { opacity: 1; }
  to { opacity: 0; transform: translateX(435.1px); }
}
</style>
