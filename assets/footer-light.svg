<svg xmlns="http://www.w3.org/2000/svg" width="600" height="150" viewBox="0 0 600 150" role="img" aria-labelledby="title">
<title id="title">The end (struck through) to be continued.</title>
<style>:root { --paper: #f4f6f9; --paper-2: #e8edf3; --paper-3: #dde4ec; --ink: #17375e; --ink-2: #2a4b75; --muted: #5d7391; --accent: #8a746e; --rule: rgba(23, 55, 94, 0.55); --rule-2: rgba(23, 55, 94, 0.16); --grid: rgba(23, 55, 94, 0.06); --grid-2: rgba(23, 55, 94, 0.13); }
.paper { fill: var(--paper); }
.paper-2 { fill: var(--paper-2); }
.paper-3 { fill: var(--paper-3); }
.ink { fill: var(--ink); }
.muted { fill: var(--muted); }
.accent { fill: var(--accent); }
.line { fill: none; stroke: var(--rule); stroke-width: 1; }
.line-2 { fill: none; stroke: var(--rule-2); stroke-width: 1; }
.heavy { fill: none; stroke: var(--ink); stroke-width: 2; }
.grid { fill: none; stroke: var(--grid); stroke-width: 1; }
.grid-2 { fill: none; stroke: var(--grid-2); stroke-width: 1; }
.draw { stroke-dasharray: 1; stroke-dashoffset: 0; }
.from-left { transform-box: fill-box; transform-origin: left; }
.from-bottom { transform-box: fill-box; transform-origin: bottom; }
@keyframes draw { from { stroke-dashoffset: 1; } }
@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }
@keyframes grow-x { from { transform: scaleX(0); } }
@keyframes grow-y { from { transform: scaleY(0); } }
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; }
}

.struck { animation: fade 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.55s both; }
.strike { animation: grow-x 0.45s cubic-bezier(0.65, 0, 0.35, 1) 1.30s both; }
.fixed { animation: rise 0.6s cubic-bezier(0.22, 1, 0.36, 1) 1.85s both; }

.drift { animation: drift linear infinite; }
.drift-back { animation: drift-back linear infinite; }
@keyframes drift { from { transform: translateX(0); }
  to { transform: translateX(-300.0px); } }
@keyframes drift-back { from { transform: translateX(-300.0px); }
  to { transform: translateX(0); } }
</style>

