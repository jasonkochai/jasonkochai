name: readme

on:
  push:
    branches: [main]
    paths:
      - projects.yml
      - README.md
      - assets/**
      - scripts/**
      - tests/**
      - .github/workflows/readme.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - name: Rebuild the project sections (fails on a broken rule)
        run: python scripts/build_readme.py
      - run: python -m pytest -q
      - run: flake8 scripts tests
      - name: Commit if the README changed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(readme): regenerate project sections"
          git push
